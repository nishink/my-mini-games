<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Games Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="container">
        <header>
            <div class="logo-area">
                <span class="logo-icon">🕹️</span>
                <h1>MINI GAMES COLLECTION</h1>
            </div>
            <p>JavaScriptで作成した高品質なミニゲームコレクション</p>
        </header>

        <!-- メインプロジェクト（統合RPG） -->
        <section class="main-project" id="main-project-container">
            <!-- JavaScriptにより動的に挿入されます -->
        </section>

        <!-- カテゴリフィルタータブ -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="phase1">第1期: アクション</button>
            <button class="filter-btn" data-filter="phase2">第2期: パズル/アーケード</button>
            <button class="filter-btn" data-filter="phase3">第3期: アドバンスド</button>
            <button class="filter-btn" data-filter="rpg-comp">RPGシステム</button>
            <button class="filter-btn" data-filter="phase4">第4期: ストラテジー</button>
        </div>

        <!-- ミニゲーム一覧グリッド -->
        <section class="game-grid" id="game-grid">
            <!-- JavaScriptにより動的に挿入されます -->
            <noscript>
                <p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">
                    このサイトを表示するにはJavaScriptを有効にする必要があります。
                </p>
            </noscript>
        </section>

        <footer>
            <p>© 2026 Mini Games Hub. 🛠️ 今後も様々なジャンルのゲームを追加予定です。</p>
        </footer>
    </div>
</body>
</html>
